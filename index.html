<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>メディカルOne-Bo - 発信画面</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>

    <style>
        /* 全画面リセットとiPhone用調整 */
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        
        body { 
            background-color: #f0f4f8; 
            font-family: 'Noto Sans JP', sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100dvh; /* iPhoneのバーを考慮した高さ */
            width: 100vw;
            overflow: hidden; 
        }

        .kiosk-container { 
            background-color: #ffffff; 
            border-radius: 20px; 
            box-shadow: 0 15px 35px rgba(0, 86, 179, 0.1); 
            width: 92%; 
            max-width: 480px; 
            max-height: 96dvh; /* 縦も画面内に収める */
            padding: clamp(20px, 5vh, 40px) 25px; 
            text-align: center; 
            border-top: 8px solid #0056B3;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .header h1 { color: #0056B3; font-size: clamp(22px, 6vw, 30px); font-weight: 900; margin-bottom: 5px; }
        .header p { color: #64748b; font-size: clamp(13px, 3.5vw, 15px); font-weight: 700; margin-bottom: 20px; }

        .display { 
            background-color: #e2e8f0; 
            border-radius: 12px; 
            height: clamp(60px, 10vh, 80px); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            margin-bottom: 20px; 
            border: 2px inset #cbd5e1; 
        }
        .display span { font-size: clamp(32px, 10vw, 46px); font-weight: 900; letter-spacing: 10px; color: #1e293b; }

        .keypad { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: clamp(8px, 1.5vh, 15px); 
            margin-bottom: 20px; 
        }
        .key { 
            background-color: #ffffff; 
            border: 2px solid #cbd5e1; 
            border-radius: 12px; 
            font-size: clamp(24px, 4vh, 32px); 
            font-weight: 700; 
            color: #334155; 
            padding: clamp(12px, 2.5vh, 22px) 0; 
            cursor: pointer; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); 
            transition: all 0.1s;
        }
        .key:active { transform: scale(0.95); background-color: #f1f5f9; }
        .key-clear { background-color: #f87171; color: white; border-color: #ef4444; font-size: 18px; }

        .btn-call { 
            background-color: #F07E32; 
            color: white; 
            border: none; 
            border-radius: 12px; 
            font-size: clamp(20px, 5vw, 24px); 
            font-weight: 900; 
            padding: clamp(15px, 2.5vh, 20px); 
            width: 100%; 
            box-shadow: 0 8px 15px rgba(240, 126, 50, 0.3); 
            cursor: pointer;
        }
        .btn-call:disabled { background-color: #cbd5e1; box-shadow: none; opacity: 0.6; cursor: not-allowed; }

        #status-message { margin-top: 15px; font-size: 14px; font-weight: 700; height: 20px; }
    </style>
</head>
<body>

<div class="kiosk-container">
    <div class="header">
        <h1>メディカルOne-Bo</h1>
        <p>繋ぎたい相手の6桁の番号を押してください</p>
    </div>
    <div class="display" id="pin-display"></div>
    <div class="keypad">
        <button class="key" onclick="inputDigit(1)">1</button>
        <button class="key" onclick="inputDigit(2)">2</button>
        <button class="key" onclick="inputDigit(3)">3</button>
        <button class="key" onclick="inputDigit(4)">4</button>
        <button class="key" onclick="inputDigit(5)">5</button>
        <button class="key" onclick="inputDigit(6)">6</button>
        <button class="key" onclick="inputDigit(7)">7</button>
        <button class="key" onclick="inputDigit(8)">8</button>
        <button class="key" onclick="inputDigit(9)">9</button>
        <button class="key key-clear" onclick="clearDigit()">訂正</button>
        <button class="key" onclick="inputDigit(0)">0</button>
        <button class="key" style="visibility: hidden;"></button> 
    </div>
    <button class="btn-call" id="call-button" onclick="makeCall()" disabled>発 信 📞</button>
    <div id="status-message"></div>
</div>

<script>
    // 1. Firebase設定（維持）
    const firebaseConfig = {
        apiKey: "AIzaSyBRuOkJzU6Yu2x-Arg7NjqySmqCA1CD65s",
        authDomain: "plaza-crm.firebaseapp.com",
        projectId: "plaza-crm",
        storageBucket: "plaza-crm.firebasestorage.app",
        messagingSenderId: "781455940982",
        appId: "1:781455940982:web:04c1816ec65cde91ea2e57"
    };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // 2. ロジック（維持）
    let currentPin = "";
    const displayElement = document.getElementById("pin-display");
    const callButton = document.getElementById("call-button");
    const statusMessage = document.getElementById("status-message");

    function inputDigit(digit) {
        if (currentPin.length < 6) {
            currentPin += digit;
            updateDisplay();
        }
    }

    function clearDigit() {
        if (currentPin.length > 0) {
            currentPin = currentPin.slice(0, -1);
            updateDisplay();
        }
    }

    function updateDisplay() {
        displayElement.innerHTML = `<span>${currentPin}</span>`;
        callButton.disabled = currentPin.length !== 6;
        statusMessage.innerText = "";
    }

    function makeCall() {
        if (currentPin.length === 6) {
            statusMessage.style.color = "#059669";
            statusMessage.innerText = "通信中...";
            callButton.disabled = true;

            db.collection("rooms").doc(currentPin).get().then((doc) => {
                if (doc.exists) {
                    const roomUrl = doc.data().url;
                    document.body.innerHTML = `
                        <iframe 
                            src="${roomUrl}" 
                            allow="camera; microphone; fullscreen; display-capture" 
                            style="width: 100vw; height: 100dvh; border: none;">
                        </iframe>
                        <button onclick="location.reload()" style="position: absolute; top: 15px; right: 15px; padding: 10px 20px; font-size: 16px; font-weight: bold; background-color: #ef4444; color: white; border: none; border-radius: 8px; cursor: pointer; z-index: 1000;">
                            終了
                        </button>
                    `;
                } else {
                    statusMessage.style.color = "#ef4444";
                    statusMessage.innerText = "番号が登録されていません。";
                    setTimeout(() => {
                        currentPin = "";
                        updateDisplay();
                    }, 2000);
                }
            }).catch((error) => {
                statusMessage.style.color = "#ef4444";
                statusMessage.innerText = "エラーが発生しました。";
                callButton.disabled = false;
            });
        }
    }
</script>

</body>
</html>
