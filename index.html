<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>メディカルOne-Bo - 原因究明テスト版</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { background-color: #f0f4f8; font-family: 'Noto Sans JP', sans-serif; display: flex; justify-content: center; align-items: center; height: 100dvh; width: 100vw; overflow: hidden; }
        
        .kiosk-container { background-color: #ffffff; border-radius: 20px; box-shadow: 0 15px 35px rgba(0, 86, 179, 0.1); width: 92%; max-width: 480px; max-height: 96dvh; padding: clamp(20px, 5vh, 40px) 25px; text-align: center; border-top: 8px solid #0056B3; display: flex; flex-direction: column; justify-content: center; position: relative; z-index: 10; overflow: hidden;}
        
        .header h1 { color: #0056B3; font-size: clamp(22px, 6vw, 30px); font-weight: 900; margin-bottom: 5px; }
        .header p { color: #64748b; font-size: clamp(13px, 3.5vw, 15px); font-weight: 700; margin-bottom: 10px; }
        
        .btn-call { background-color: #F07E32; color: white; border: none; border-radius: 12px; font-size: clamp(20px, 5vw, 24px); font-weight: 900; padding: clamp(15px, 2.5vh, 20px); width: 100%; cursor: pointer; margin-bottom: 10px; }
        .btn-register { background-color: #10b981; color: white; border: none; border-radius: 12px; font-size: 18px; font-weight: 900; padding: 15px; width: 100%; cursor: pointer; }

        /* ログイン画面のスタイル */
        #login-overlay { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh; background-color: #f0f4f8; z-index: 200; flex-direction: column; justify-content: center; align-items: center; }
        .login-input { width: 100%; padding: 15px; margin-bottom: 15px; border-radius: 8px; border: 2px solid #cbd5e1; font-size: 18px; text-align: center; box-sizing: border-box; }
    </style>
</head>
<body>

<div id="login-overlay">
    <div class="kiosk-container" style="padding: 40px 30px; max-height: none; border-top: 8px solid #ef4444;">
        <div class="header">
            <h1 style="font-size: 28px; color: #ef4444;">【テスト】直接登録・ログイン</h1>
        </div>
        <input type="text" id="test-email" class="login-input" placeholder="メールアドレス全体 (例: b@b.com)">
        <input type="text" id="test-password" class="login-input" placeholder="パスワード全体 (例: bbbbbb)">
        
        <button class="btn-call" style="background-color: #ef4444;" onclick="attemptLogin()">① ログインしてみる</button>
        <button class="btn-register" onclick="attemptRegister()">② システム側から強制登録する</button>
        
        <div id="login-error" style="color: #ef4444; margin-top: 15px; font-weight: bold; font-size: 14px; min-height: 20px;"></div>
    </div>
</div>

<div class="kiosk-container" id="main-container">
    <div id="caller-ui">
        <div class="header"><h1>メディカルOne-Bo</h1></div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBRuOkJzU6Yu2x-Arg7NjqySmqCA1CD65s",
        authDomain: "plaza-crm.firebaseapp.com",
        projectId: "plaza-crm",
        storageBucket: "plaza-crm.firebasestorage.app",
        messagingSenderId: "781455940982",
        appId: "1:781455940982:web:04c1816ec65cde91ea2e57"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth(); 

    window.onload = () => {
        document.getElementById("login-overlay").style.display = "flex";
    };

    // --- ① ログインテスト ---
    function attemptLogin() {
        const email = document.getElementById("test-email").value.trim();
        const password = document.getElementById("test-password").value.trim();

        if(!email || !password) return;
        document.getElementById("login-error").innerText = `送信中...`;

        auth.signInWithEmailAndPassword(email, password)
            .then(() => {
                alert("🎉 ログイン成功！");
                document.getElementById("login-overlay").style.display = "none";
            })
            .catch((error) => {
                document.getElementById("login-error").style.color = "#ef4444";
                document.getElementById("login-error").innerText = `エラー: ${error.code}`;
            });
    }

    // --- ② 強制登録テスト（★今回の主役） ---
    function attemptRegister() {
        const email = document.getElementById("test-email").value.trim();
        const password = document.getElementById("test-password").value.trim();

        if(!email || !password) return;
        document.getElementById("login-error").style.color = "#10b981";
        document.getElementById("login-error").innerText = `Firebaseに強制登録中...`;

        auth.createUserWithEmailAndPassword(email, password)
            .then(() => {
                alert("🎉 大成功！Firebaseへのユーザー作成とログインが同時に完了しました！\n（Firebaseの画面を開かなくても、プログラムから完璧に繋がっています）");
                document.getElementById("login-overlay").style.display = "none";
            })
            .catch((error) => {
                document.getElementById("login-error").style.color = "#ef4444";
                document.getElementById("login-error").innerText = `登録エラー: ${error.code}\n※この英語メッセージを教えてください！`;
            });
    }
</script>
</body>
</html>
