<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>メディカルOne-Bo - 発信画面</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>

    <style>
        /* キオスク端末用の全画面リセット */
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { background-color: #f0f4f8; font-family: 'Noto Sans JP', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        .kiosk-container { background-color: #ffffff; border-radius: 20px; box-shadow: 0 15px 35px rgba(0, 86, 179, 0.1); width: 100%; max-width: 600px; padding: 50px; text-align: center; border-top: 10px solid #0056B3; }
        .header h1 { color: #0056B3; font-size: 32px; font-weight: 900; margin-bottom: 10px; }
        .header p { color: #64748b; font-size: 18px; font-weight: 700; margin-bottom: 30px; }
        .display { background-color: #e2e8f0; border-radius: 12px; height: 80px; display: flex; justify-content: center; align-items: center; margin-bottom: 30px; border: 2px inset #cbd5e1; }
        .display span { font-size: 48px; font-weight: 900; letter-spacing: 15px; color: #1e293b; min-width: 20px; }
        .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
        .key { background-color: #ffffff; border: 2px solid #cbd5e1; border-radius: 12px; font-size: 36px; font-weight: 700; color: #334155; padding: 25px 0; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.05); transition: all 0.1s ease; }
        .key:active { transform: scale(0.95); background-color: #f1f5f9; box-shadow: 0 2px 3px rgba(0,0,0,0.05); }
        .key-clear { background-color: #f87171; color: white; border-color: #ef4444; font-size: 24px; }
        .key-clear:active { background-color: #ef4444; }
        .btn-call { background-color: #F07E32; color: white; border: none; border-radius: 12px; font-size: 28px; font-weight: 900; padding: 25px; width: 100%; cursor: pointer; box-shadow: 0 8px 15px rgba(240, 126, 50, 0.3); transition: all 0.2s ease; }
        .btn-call:active { transform: scale(0.98); box-shadow: 0 4px 8px rgba(240, 126, 50, 0.3); }
        .btn-call:disabled { background-color: #cbd5e1; box-shadow: none; cursor: not-allowed; transform: none; }
        #status-message { margin-top: 20px; font-size: 18px; font-weight: 700; color: #059669; height: 27px; }
    </style>
</head>
<body>

<div class="kiosk-container">
    <div class="header">
        <h1>メディカルOne-Bo</h1>
        <p>繋ぎたい相手の6桁の番号を押してください</p>
    </div>
    <div class="display" id="pin-display"></div>
    <div class="keypad">
        <button class="key" onclick="inputDigit(1)">1</button>
        <button class="key" onclick="inputDigit(2)">2</button>
        <button class="key" onclick="inputDigit(3)">3</button>
        <button class="key" onclick="inputDigit(4)">4</button>
        <button class="key" onclick="inputDigit(5)">5</button>
        <button class="key" onclick="inputDigit(6)">6</button>
        <button class="key" onclick="inputDigit(7)">7</button>
        <button class="key" onclick="inputDigit(8)">8</button>
        <button class="key" onclick="inputDigit(9)">9</button>
        <button class="key key-clear" onclick="clearDigit()">訂正</button>
        <button class="key" onclick="inputDigit(0)">0</button>
        <button class="key" style="visibility: hidden;"></button> 
    </div>
    <button class="btn-call" id="call-button" onclick="makeCall()" disabled>発 信 📞</button>
    <div id="status-message"></div>
</div>

<script>
    // --------------------------------------------------
    // 1. Firebase（データベース）の接続設定
    // --------------------------------------------------
    const firebaseConfig = {
        apiKey: "AIzaSyBRuOkJzU6Yu2x-Arg7NjqySmqCA1CD65s",
        authDomain: "plaza-crm.firebaseapp.com",
        projectId: "plaza-crm",
        storageBucket: "plaza-crm.firebasestorage.app",
        messagingSenderId: "781455940982",
        appId: "1:781455940982:web:04c1816ec65cde91ea2e57"
    };
    
    // データベースを起動
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // --------------------------------------------------
    // 2. 画面の動き（テンキー制御）
    // --------------------------------------------------
    let currentPin = "";
    const displayElement = document.getElementById("pin-display");
    const callButton = document.getElementById("call-button");
    const statusMessage = document.getElementById("status-message");

    function inputDigit(digit) {
        if (currentPin.length < 6) {
            currentPin += digit;
            updateDisplay();
        }
    }

    function clearDigit() {
        if (currentPin.length > 0) {
            currentPin = currentPin.slice(0, -1);
            updateDisplay();
        }
    }

    function updateDisplay() {
        displayElement.innerHTML = `<span>${currentPin}</span>`;
        callButton.disabled = currentPin.length !== 6;
        statusMessage.innerText = "";
    }

    // --------------------------------------------------
    // 3. 発信ボタンを押したときの処理（データベース照会）
    // --------------------------------------------------
    function makeCall() {
        if (currentPin.length === 6) {
            // 文字を緑色にして「通信中」と表示
            statusMessage.style.color = "#059669";
            statusMessage.innerText = "通信中...";
            callButton.disabled = true;

            // Firestoreデータベースの「rooms」フォルダから、入力された6桁の番号を探す
            db.collection("rooms").doc(currentPin).get().then((doc) => {
                if (doc.exists) {
                    // 【成功】番号が見つかった場合！
                    const roomUrl = doc.data().url;
                    
                    // 画面を通話用のiframeに切り替える
                    document.body.innerHTML = `
                        <iframe 
                            src="${roomUrl}" 
                            allow="camera; microphone; fullscreen; display-capture" 
                            style="width: 100vw; height: 100vh; border: none;">
                        </iframe>
                        <button onclick="location.reload()" style="position: absolute; top: 20px; right: 20px; padding: 15px 30px; font-size: 20px; font-weight: bold; background-color: #ef4444; color: white; border: none; border-radius: 8px; cursor: pointer; z-index: 1000;">
                            通話を終了する
                        </button>
                    `;
                } else {
                    // 【失敗】番号が見つからなかった場合
                    statusMessage.style.color = "#ef4444"; // 赤色にしてエラーを知らせる
                    statusMessage.innerText = "番号が間違っているか、登録されていません。";
                    
                    // 2秒後に画面をリセットして再入力できるようにする
                    setTimeout(() => {
                        currentPin = "";
                        updateDisplay();
                    }, 2000);
                }
            }).catch((error) => {
                console.error("エラー:", error);
                statusMessage.style.color = "#ef4444";
                statusMessage.innerText = "システムエラーが発生しました。";
                callButton.disabled = false;
            });
        }
    }
</script>

</body>
</html>
