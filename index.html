<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>メディカルワンボ - 診察ポータル</title>
    <style>
        /* レスポンシブ＆フルスクリーン設定 */
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
            background-color: #F4F7F9; /* より自然な背景色 */
            user-select: none;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ヘッダー周りを公式っぽくシャープに */
        .header {
            background-color: #ffffff;
            color: #0056B3;
            padding: 3vh 5vw;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            z-index: 10;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .header h1 {
            margin: 0;
            font-size: clamp(2rem, 4vw, 3.5rem);
            font-weight: bold;
            letter-spacing: 2px;
        }

        .header .badge {
            background-color: #0056B3;
            color: white;
            padding: 8px 16px;
            border-radius: 4px;
            font-size: clamp(1rem, 1.5vw, 1.5rem);
            font-weight: bold;
        }

        .header .subtitle {
            font-size: clamp(1rem, 2vw, 1.8rem);
            color: #666;
            margin-bottom: 5px;
        }

        /* メインコンテンツエリア */
        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 4vh;
            padding: 5vh 5vw;
        }

        /* ボタンの共通スタイリング（重厚感と押しやすさ） */
        .action-button {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 80%;
            max-width: 1400px;
            padding: 4vh 2vw;
            font-size: clamp(1.8rem, 3.5vw, 3.5rem);
            font-weight: bold;
            text-decoration: none;
            border-radius: 16px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            transition: all 0.2s ease;
            cursor: pointer;
            border: none;
        }

        .action-button:active {
            transform: translateY(4px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        /* メインアクション（オレンジ） */
        .btn-primary {
            background: linear-gradient(180deg, #F68B33 0%, #E66A19 100%);
            color: white;
            border-bottom: 6px solid #C4550E;
        }

        /* セカンダリアクション（白） */
        .btn-secondary {
            background-color: white;
            color: #0056B3;
            border: 2px solid #0056B3;
            border-bottom: 6px solid #004490;
        }

        /* 家族通話アクション（緑系で差別化） */
        .btn-family {
            background: linear-gradient(180deg, #4CAF50 0%, #388E3C 100%);
            color: white;
            border-bottom: 6px solid #2E7D32;
        }

        /* モーダル（テンキー入力画面） */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.7);
            z-index: 100;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background: white;
            padding: 50px;
            border-radius: 20px;
            width: 80%;
            max-width: 800px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        .modal-content h2 {
            font-size: 2.5rem;
            color: #333;
            margin-top: 0;
        }

        .pin-display {
            font-size: 4rem;
            letter-spacing: 10px;
            margin: 30px 0;
            padding: 20px;
            background: #f0f0f0;
            border-radius: 10px;
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .key {
            font-size: 3rem;
            padding: 20px 0;
            background: #fff;
            border: 2px solid #ccc;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        
        .key:active {
            background: #e0e0e0;
        }

        .key-action {
            font-size: 2rem;
            background: #f9f9f9;
        }

        .modal-close {
            font-size: 1.5rem;
            color: #666;
            cursor: pointer;
            text-decoration: underline;
            margin-top: 20px;
            display: inline-block;
        }

        .footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 1.5vh;
            font-size: clamp(0.8rem, 1.5vw, 1.2rem);
        }
    </style>
</head>
<body>

<div class="header">
    <div class="header-left">
        <div class="badge">専用端末</div>
        <h1>メディカルワンボ</h1>
    </div>
    <div class="subtitle">プラザホールディングス × ファストドクター</div>
</div>

<div class="content">
    <a href="https://contact.fastdoctor.jp/online-consultation/?_gl=1*db8q6s*_gcl_au*MTU2MDQ0ODE4Ny4xNzcyNjg4MTQ0" class="action-button btn-primary">
        すぐにオンライン診療を申し込む (内科・小児科)
    </a>

    <a href="https://fastdoctor.jp/online-consultation/" class="action-button btn-secondary">
        対応できる症状・待ち時間を確認する
    </a>

    <button onclick="openModal()" class="action-button btn-family">
        ご家族とビデオ通話でお話しする
    </button>
</div>

<div class="footer">
    ※本画面はプラザホールディングス社内プレゼン用のプロトタイプUIです。実際の医療行為は提携医療機関が実施します。
</div>

<div class="modal-overlay" id="familyModal">
    <div class="modal-content">
        <h2>ご家族から伝えられた<br>「ルーム番号」を入力してください</h2>
        <div class="pin-display" id="pinDisplay"></div>
        <div class="keypad">
            <div class="key" onclick="inputPin(1)">1</div>
            <div class="key" onclick="inputPin(2)">2</div>
            <div class="key" onclick="inputPin(3)">3</div>
            <div class="key" onclick="inputPin(4)">4</div>
            <div class="key" onclick="inputPin(5)">5</div>
            <div class="key" onclick="inputPin(6)">6</div>
            <div class="key" onclick="inputPin(7)">7</div>
            <div class="key" onclick="inputPin(8)">8</div>
            <div class="key" onclick="inputPin(9)">9</div>
            <div class="key key-action" onclick="clearPin()">クリア</div>
            <div class="key" onclick="inputPin(0)">0</div>
            <div class="key key-action" style="background:#0056B3; color:white; border:none;" onclick="connectCall()">接続</div>
        </div>
        <div class="modal-close" onclick="closeModal()">キャンセルして戻る</div>
    </div>
</div>

<script>
    let currentPin = "";
    const pinDisplay = document.getElementById("pinDisplay");
    const modal = document.getElementById("familyModal");

    function openModal() {
        currentPin = "";
        pinDisplay.innerText = "";
        modal.style.display = "flex";
    }

    function closeModal() {
        modal.style.display = "none";
    }

    function inputPin(num) {
        if(currentPin.length < 6) { // 最大6桁まで
            currentPin += num;
            pinDisplay.innerText = currentPin;
        }
    }

    function clearPin() {
        currentPin = "";
        pinDisplay.innerText = "";
    }

    function connectCall() {
        if(currentPin.length > 0) {
            // デモ用の演出：番号が入力されていればダミーの通話画面(Whereby等)に飛ばす
            alert("デモ動作: ルーム番号「" + currentPin + "」で接続します。\n(実際はここで専用のビデオ通話URLに遷移します)");
            closeModal();
            // window.open('https://whereby.com/medical-onebo-demo', '_blank');
        } else {
            alert("ルーム番号を入力してください。");
        }
    }
</script>

</body>
</html>
